  <!-- Middle: White Band with Navy Blue Hairline -->
  <rect x="0" y="4" width="600" height="4" fill="#ffffff"/>
  <line x1="0" y1="6" x2="600" y2="6" stroke="#000080" stroke-width="0.5" stroke-dasharray="4 2"/>
  <!-- Bottom: India Green Band -->
  <rect x="0" y="8" width="600" height="4" fill="#047857"/>

  <!-- Subtle Anti-Counterfeit Guilloche Waves overlaying ribbon -->
  <path d="M0 6 Q 25 3, 50 6 T 100 6 T 150 6 T 200 6 T 250 6 T 300 6 T 350 6 T 400 6 T 450 6 T 500 6 T 550 6 T 600 6" 
        stroke="#ffffff" stroke-width="0.6" stroke-opacity="0.7" fill="none"/>
</svg>
