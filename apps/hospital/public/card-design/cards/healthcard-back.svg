<svg width="630" height="1000" viewBox="0 0 630 1000" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Clip Path for CR80 Standard Rounded Corners -->
    <clipPath id="portrait_back_clip">
      <rect x="0" y="0" width="630" height="1000" rx="36" ry="36"/>
    </clipPath>

    <!-- Guilloche Pattern for Back -->
    <pattern id="back_sec_guilloche" x="0" y="0" width="630" height="1000" patternUnits="userSpaceOnUse">
      <g opacity="0.07" stroke="#047857" stroke-width="0.8" fill="none">
        <path d="M0 80 Q 80 50, 160 80 T 320 80 T 480 80 T 630 80"/>
        <path d="M0 130 Q 80 100, 160 130 T 320 130 T 480 130 T 630 130"/>
        <path d="M0 180 Q 80 150, 160 180 T 320 180 T 480 180 T 630 180"/>
        <path d="M0 230 Q 80 200, 160 230 T 320 230 T 480 230 T 630 230"/>
        <path d="M0 280 Q 80 250, 160 280 T 320 280 T 480 280 T 630 280"/>
        <path d="M0 330 Q 80 300, 160 330 T 320 330 T 480 330 T 630 330"/>
        <path d="M0 380 Q 80 350, 160 380 T 320 380 T 480 380 T 630 380"/>
        <path d="M0 430 Q 80 400, 160 430 T 320 430 T 480 430 T 630 430"/>
        <path d="M0 480 Q 80 450, 160 480 T 320 480 T 480 480 T 630 480"/>
        <path d="M0 530 Q 80 500, 160 530 T 320 530 T 480 530 T 630 530"/>
        <path d="M0 580 Q 80 550, 160 580 T 320 580 T 480 580 T 630 580"/>
        <path d="M0 630 Q 80 600, 160 630 T 320 630 T 480 630 T 630 630"/>
        <path d="M0 680 Q 80 650, 160 680 T 320 680 T 480 680 T 630 680"/>
        <path d="M0 730 Q 80 700, 160 730 T 320 730 T 480 730 T 630 730"/>
        <path d="M0 780 Q 80 750, 160 780 T 320 780 T 480 780 T 630 780"/>
        <path d="M0 830 Q 80 800, 160 830 T 320 830 T 480 830 T 630 830"/>
        <path d="M0 880 Q 80 850, 160 880 T 320 880 T 480 880 T 630 880"/>
        <path d="M0 930 Q 80 900, 160 930 T 320 930 T 480 930 T 630 930"/>
      </g>
    </pattern>
  </defs>

  <g clip-path="url(#portrait_back_clip)">
    <!-- Base Off-White PVC Surface -->
    <rect width="630" height="1000" fill="#fcfdfd"/>
    <rect width="630" height="1000" fill="#047857" fill-opacity="0.015"/>

    <!-- Guilloche Lathe Grid -->
    <rect width="630" height="1000" fill="url(#back_sec_guilloche)"/>

    <!-- Perimeter Anti-Copy Microtext Border -->
    <rect x="14" y="14" width="602" height="972" rx="24" stroke="#cbd5e1" stroke-width="0.8" fill="none"/>
    <rect x="18" y="18" width="594" height="964" rx="20" stroke="#047857" stroke-width="0.5" stroke-dasharray="3 1.5" fill="none" opacity="0.6"/>

    <!-- Watermarked Ashoka Chakra on Back -->
    <g transform="translate(315, 340)" opacity="0.08">
      <circle cx="0" cy="0" r="150" stroke="#000080" stroke-width="4" fill="none"/>
      <circle cx="0" cy="0" r="32" stroke="#000080" stroke-width="2.5" fill="#ffffff"/>
      <circle cx="0" cy="0" r="10" fill="#000080"/>
    </g>

    <!-- ================= TOP SECTION: IMPORTANT INSTRUCTIONS ================= -->
    <g transform="translate(315, 68)" text-anchor="middle">
      <text font-family="'Noto Sans Devanagari', 'Inter', sans-serif" font-size="28" font-weight="900" fill="#0f172a">
        महत्वपूर्ण निर्देश
      </text>
      <text y="32" font-family="'Inter', sans-serif" font-size="21" font-weight="800" fill="#0f172a" letter-spacing="0.8">
        IMPORTANT INSTRUCTIONS
      </text>
    </g>

    <!-- 4 Instructions (Matching Image 1) -->
    <g transform="translate(42, 160)" font-family="'Noto Sans Devanagari', 'Inter', sans-serif" fill="#1e293b">
      
      <!-- Point 1 -->
      <g>
        <text font-size="18" font-weight="700">
          1. यह कार्ड केवल स्वास्थ्य सेवाओं के लिए है।
        </text>
        <text y="28" font-family="'Inter', sans-serif" font-size="16.5" font-weight="600" fill="#475569">
          This card is for healthcare services only.
        </text>
      </g>

      <!-- Point 2 -->
      <g transform="translate(0, 78)">
        <text font-size="18" font-weight="700">
          2. खोने पर हेल्पलाइन को सूचित करें।
        </text>
        <text y="28" font-family="'Inter', sans-serif" font-size="16.5" font-weight="600" fill="#475569">
          Inform helpline immediately if lost.
        </text>
      </g>

      <!-- Point 3 -->
      <g transform="translate(0, 156)">
        <text font-size="18" font-weight="700">
          3. यह कार्ड अहस्तांतरणीय है।
        </text>
        <text y="28" font-family="'Inter', sans-serif" font-size="16.5" font-weight="600" fill="#475569">
          This card is non-transferable.
        </text>
      </g>

      <!-- Point 4 -->
      <g transform="translate(0, 234)">
        <text font-size="18" font-weight="700">
          4. आपातकाल में QR कोड स्कैन करें। <tspan font-family="'Inter', sans-serif" font-size="16.5" font-weight="600" fill="#475569">Scan QR code</tspan>
        </text>
        <text y="28" font-family="'Inter', sans-serif" font-size="16.5" font-weight="600" fill="#475569">
          in emergency for medical info.
        </text>
      </g>

    </g>

    <!-- ================= MIDDLE TRICOLOR SECURITY STRIPE (MATCHING IMAGE 1) ================= -->
    <g transform="translate(0, 520)">
      <rect width="630" height="5" fill="#f97316"/>
      <rect y="5" width="630" height="3" fill="#ffffff"/>
      <rect y="8" width="630" height="5" fill="#138808"/>
    </g>

    <!-- ================= BOTTOM SECTION: AUTHORITY & HELPLINES (MATCHING IMAGE 1) ================= -->
    <g transform="translate(42, 560)">
      
      <!-- Left: State Emblem + National Health Authority Signatory -->
      <g>
        <!-- Lion Capital Vector Silhouette -->
        <g transform="scale(0.18)" fill="#0f172a">
          <path d="M120 20C110 20 102 28 102 38C102 43 104 47 107 50C98 54 92 63 92 73C92 84 99 93 109 97C108 99 108 102 108 104C108 114 116 122 126 122C136 122 144 114 144 104C144 102 144 99 143 97C153 93 160 84 160 73C160 63 154 54 145 50C148 47 150 43 150 38C150 28 142 20 132 20H120Z"/>
          <path d="M180 30C168 30 158 40 158 52C158 58 160 63 164 67C153 72 145 83 145 96C145 110 154 122 166 127C165 130 164 133 164 136C164 148 174 158 186 158C198 158 208 148 208 136C208 133 207 130 206 127C218 122 227 110 227 96C227 83 219 72 208 67C212 63 214 58 214 52C214 40 204 30 192 30H180Z"/>
          <rect x="80" y="166" width="160" height="24" rx="4"/>
          <circle cx="160" cy="178" r="8" fill="#ffffff"/>
          <path d="M90 192C90 208 110 220 160 220C210 220 230 208 230 192H90Z"/>
        </g>
        <g transform="translate(56, 8)">
          <text font-family="'Noto Sans Devanagari', 'Inter', sans-serif" font-size="14" font-weight="800" fill="#0f172a">
            राष्ट्रीय स्वास्थ्य
          </text>
          <text y="18" font-family="'Inter', sans-serif" font-size="13" font-weight="800" fill="#0f172a">
            health authority
          </text>
        </g>

        <!-- Signatory Title -->
        <g transform="translate(0, 78)">
          <text font-family="'Inter', sans-serif" font-size="15" font-weight="700" fill="#334155">
            Authorized Signatory
          </text>
          <text y="24" font-family="'Noto Sans Devanagari', 'Inter', sans-serif" font-size="14.5" font-weight="700" fill="#334155">
            निदेशक / Director
          </text>
        </g>
      </g>

      <!-- Right: Helpline & Portal Info (Matching Image 1) -->
      <g transform="translate(320, 20)">
        <text font-family="'Noto Sans Devanagari', 'Inter', sans-serif" font-size="16" font-weight="800" fill="#0f172a">
          हेल्पलाइन / HELPLINE: 104
        </text>
        <text y="36" font-family="'Inter', sans-serif" font-size="24" font-weight="900" fill="#0f172a" letter-spacing="1">
          1800-XXX-XXXX
        </text>
        <g transform="translate(0, 68)">
          <text font-family="'Inter', sans-serif" font-size="14" font-weight="700" fill="#047857">
            🌐 www.nha.gov.in
          </text>
        </g>
      </g>

    </g>

    <!-- ================= HIGH-DENSITY LINEAR BARCODE (MATCHING IMAGE 1) ================= -->
    <g transform="translate(68, 718)">
      <!-- Real SVG Barcode Simulation Lines -->
      <g fill="#0f172a">
        <!-- Guard bars -->
        <rect x="0" y="0" width="4" height="68"/>
        <rect x="8" y="0" width="4" height="68"/>
        
        <!-- Data bars pattern -->
        <rect x="20" y="0" width="3" height="68"/>
        <rect x="28" y="0" width="6" height="68"/>
        <rect x="40" y="0" width="2" height="68"/>
        <rect x="48" y="0" width="8" height="68"/>
        <rect x="62" y="0" width="4" height="68"/>
        <rect x="72" y="0" width="2" height="68"/>
        <rect x="80" y="0" width="6" height="68"/>
        <rect x="94" y="0" width="3" height="68"/>
        <rect x="104" y="0" width="8" height="68"/>
        <rect x="118" y="0" width="4" height="68"/>
        <rect x="128" y="0" width="2" height="68"/>
        <rect x="138" y="0" width="6" height="68"/>
        <rect x="150" y="0" width="3" height="68"/>
        <rect x="160" y="0" width="8" height="68"/>
        <rect x="174" y="0" width="4" height="68"/>
        <rect x="184" y="0" width="2" height="68"/>
        <rect x="194" y="0" width="6" height="68"/>
        <rect x="206" y="0" width="4" height="68"/>
        <rect x="216" y="0" width="8" height="68"/>
        <rect x="230" y="0" width="2" height="68"/>
        <rect x="240" y="0" width="6" height="68"/>
        <rect x="252" y="0" width="4" height="68"/>
        <rect x="264" y="0" width="8" height="68"/>
        <rect x="278" y="0" width="2" height="68"/>
        <rect x="288" y="0" width="6" height="68"/>
        <rect x="300" y="0" width="4" height="68"/>
        <rect x="312" y="0" width="8" height="68"/>
        <rect x="326" y="0" width="3" height="68"/>
        <rect x="336" y="0" width="6" height="68"/>
        <rect x="348" y="0" width="2" height="68"/>
        <rect x="358" y="0" width="8" height="68"/>
        <rect x="372" y="0" width="4" height="68"/>
        <rect x="382" y="0" width="2" height="68"/>
        <rect x="392" y="0" width="6" height="68"/>
        <rect x="404" y="0" width="4" height="68"/>
        <rect x="414" y="0" width="8" height="68"/>
        <rect x="428" y="0" width="3" height="68"/>
        <rect x="438" y="0" width="6" height="68"/>
        <rect x="450" y="0" width="2" height="68"/>
        <rect x="460" y="0" width="8" height="68"/>
        <rect x="474" y="0" width="4" height="68"/>

        <!-- End guard bars -->
        <rect x="484" y="0" width="4" height="68"/>
        <rect x="492" y="0" width="4" height="68"/>
      </g>

      <!-- Serial Number Text below Barcode (Matching Image 1) -->
      <g transform="translate(248, 96)" text-anchor="middle">
        <text font-family="'JetBrains Mono', 'Courier New', monospace" font-size="20" font-weight="800" fill="#0f172a" letter-spacing="2">
          SERIAT6543210
        </text>
      </g>
    </g>

    <!-- Bottom Tricolor Security Stripe -->
    <g transform="translate(0, 856)">
      <rect width="630" height="5" fill="#f97316"/>
      <rect y="5" width="630" height="3" fill="#ffffff"/>
      <rect y="8" width="630" height="5" fill="#138808"/>
    </g>

    <!-- Outer Die-Cut PVC Border -->
    <rect x="1.5" y="1.5" width="627" height="997" rx="35" ry="35" stroke="#cbd5e1" stroke-width="2.5" fill="none"/>
  </g>
</svg>
