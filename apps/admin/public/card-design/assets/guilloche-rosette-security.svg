<svg width="400" height="400" viewBox="0 0 400 400" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Outer Multi-Lobed Guilloche Rosette Layer (Cyan/Blue Waves) -->
  <g opacity="0.35" stroke="#0ea5e9" stroke-width="0.65" fill="none">
    <!-- 12-lobed modulated spirograph rosette -->
    <path d="M 200,60 C 230,60 260,80 280,105 C 300,130 340,150 340,180 C 340,210 320,240 295,265 C 270,290 240,320 210,320 C 180,320 150,300 125,275 C 100,250 60,230 60,200 C 60,170 80,140 105,115 C 130,90 170,60 200,60 Z" transform="rotate(0, 200, 200)"/>
    <path d="M 200,60 C 230,60 260,80 280,105 C 300,130 340,150 340,180 C 340,210 320,240 295,265 C 270,290 240,320 210,320 C 180,320 150,300 125,275 C 100,250 60,230 60,200 C 60,170 80,140 105,115 C 130,90 170,60 200,60 Z" transform="rotate(15, 200, 200)"/>
    <path d="M 200,60 C 230,60 260,80 280,105 C 300,130 340,150 340,180 C 340,210 320,240 295,265 C 270,290 240,320 210,320 C 180,320 150,300 125,275 C 100,250 60,230 60,200 C 60,170 80,140 105,115 C 130,90 170,60 200,60 Z" transform="rotate(30, 200, 200)"/>
    <path d="M 200,60 C 230,60 260,80 280,105 C 300,130 340,150 340,180 C 340,210 320,240 295,265 C 270,290 240,320 210,320 C 180,320 150,300 125,275 C 100,250 60,230 60,200 C 60,170 80,140 105,115 C 130,90 170,60 200,60 Z" transform="rotate(45, 200, 200)"/>
    <path d="M 200,60 C 230,60 260,80 280,105 C 300,130 340,150 340,180 C 340,210 320,240 295,265 C 270,290 240,320 210,320 C 180,320 150,300 125,275 C 100,250 60,230 60,200 C 60,170 80,140 105,115 C 130,90 170,60 200,60 Z" transform="rotate(60, 200, 200)"/>
    <path d="M 200,60 C 230,60 260,80 280,105 C 300,130 340,150 340,180 C 340,210 320,240 295,265 C 270,290 240,320 210,320 C 180,320 150,300 125,275 C 100,250 60,230 60,200 C 60,170 80,140 105,115 C 130,90 170,60 200,60 Z" transform="rotate(75, 200, 200)"/>
  </g>

  <!-- Middle Interlaced Layer (Purple/Violet Waves) -->
  <g opacity="0.3" stroke="#8b5cf6" stroke-width="0.65" fill="none">
    <ellipse rx="130" ry="75" cx="200" cy="200" transform="rotate(0, 200, 200)"/>
    <ellipse rx="130" ry="75" cx="200" cy="200" transform="rotate(15, 200, 200)"/>
    <ellipse rx="130" ry="75" cx="200" cy="200" transform="rotate(30, 200, 200)"/>
    <ellipse rx="130" ry="75" cx="200" cy="200" transform="rotate(45, 200, 200)"/>
    <ellipse rx="130" ry="75" cx="200" cy="200" transform="rotate(60, 200, 200)"/>
    <ellipse rx="130" ry="75" cx="200" cy="200" transform="rotate(75, 200, 200)"/>
    <ellipse rx="130" ry="75" cx="200" cy="200" transform="rotate(90, 200, 200)"/>
    <ellipse rx="130" ry="75" cx="200" cy="200" transform="rotate(105, 200, 200)"/>
    <ellipse rx="130" ry="75" cx="200" cy="200" transform="rotate(120, 200, 200)"/>
    <ellipse rx="130" ry="75" cx="200" cy="200" transform="rotate(135, 200, 200)"/>
    <ellipse rx="130" ry="75" cx="200" cy="200" transform="rotate(150, 200, 200)"/>
    <ellipse rx="130" ry="75" cx="200" cy="200" transform="rotate(165, 200, 200)"/>
  </g>

  <!-- Inner Rosette Core (Pink/Magenta Waves) -->
  <g opacity="0.32" stroke="#ec4899" stroke-width="0.65" fill="none">
    <ellipse rx="85" ry="50" cx="200" cy="200" transform="rotate(10, 200, 200)"/>
    <ellipse rx="85" ry="50" cx="200" cy="200" transform="rotate(30, 200, 200)"/>
    <ellipse rx="85" ry="50" cx="200" cy="200" transform="rotate(50, 200, 200)"/>
    <ellipse rx="85" ry="50" cx="200" cy="200" transform="rotate(70, 200, 200)"/>
    <ellipse rx="85" ry="50" cx="200" cy="200" transform="rotate(90, 200, 200)"/>
    <ellipse rx="85" ry="50" cx="200" cy="200" transform="rotate(110, 200, 200)"/>
    <ellipse rx="85" ry="50" cx="200" cy="200" transform="rotate(130, 200, 200)"/>
    <ellipse rx="85" ry="50" cx="200" cy="200" transform="rotate(150, 200, 200)"/>
    <ellipse rx="85" ry="50" cx="200" cy="200" transform="rotate(170, 200, 200)"/>
  </g>

  <!-- Center Circle Aperture -->
  <circle cx="200" cy="200" r="32" stroke="#0ea5e9" stroke-width="0.8" opacity="0.4" fill="none"/>
</svg>
