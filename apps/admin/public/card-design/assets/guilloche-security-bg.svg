<svg width="600" height="380" viewBox="0 0 600 380" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Subtle Off-White Ivory Base Tint -->
  <rect width="600" height="380" fill="#f9fbfb"/>

  <!-- Primary Guilloche Lathe Grid: Sine & Cosine Waves Intersecting -->
  <g opacity="0.08" stroke="#047857" stroke-width="0.75" fill="none">
    <!-- Horizontal Harmonic Waves -->
    <path d="M0 40 Q 75 25, 150 40 T 300 40 T 450 40 T 600 40"/>
    <path d="M0 60 Q 75 45, 150 60 T 300 60 T 450 60 T 600 60"/>
    <path d="M0 80 Q 75 65, 150 80 T 300 80 T 450 80 T 600 80"/>
    <path d="M0 100 Q 75 85, 150 100 T 300 100 T 450 100 T 600 100"/>
    <path d="M0 120 Q 75 105, 150 120 T 300 120 T 450 120 T 600 120"/>
    <path d="M0 140 Q 75 125, 150 140 T 300 140 T 450 140 T 600 140"/>
    <path d="M0 160 Q 75 145, 150 160 T 300 160 T 450 160 T 600 160"/>
    <path d="M0 180 Q 75 165, 150 180 T 300 180 T 450 180 T 600 180"/>
    <path d="M0 200 Q 75 185, 150 200 T 300 200 T 450 200 T 600 200"/>
    <path d="M0 220 Q 75 205, 150 220 T 300 220 T 450 220 T 600 220"/>
    <path d="M0 240 Q 75 225, 150 240 T 300 240 T 450 240 T 600 240"/>
    <path d="M0 260 Q 75 245, 150 260 T 300 260 T 450 260 T 600 260"/>
    <path d="M0 280 Q 75 265, 150 280 T 300 280 T 450 280 T 600 280"/>
    <path d="M0 300 Q 75 285, 150 300 T 300 300 T 450 300 T 600 300"/>
    <path d="M0 320 Q 75 305, 150 320 T 300 320 T 450 320 T 600 320"/>
    <path d="M0 340 Q 75 325, 150 340 T 300 340 T 450 340 T 600 340"/>

    <!-- Counter-Phased Interlocking Harmonic Waves -->
    <path d="M0 40 Q 75 55, 150 40 T 300 40 T 450 40 T 600 40"/>
    <path d="M0 60 Q 75 75, 150 60 T 300 60 T 450 60 T 600 60"/>
    <path d="M0 80 Q 75 95, 150 80 T 300 80 T 450 80 T 600 80"/>
    <path d="M0 100 Q 75 115, 150 100 T 300 100 T 450 100 T 600 100"/>
    <path d="M0 120 Q 75 135, 150 120 T 300 120 T 450 120 T 600 120"/>
    <path d="M0 140 Q 75 155, 150 140 T 300 140 T 450 140 T 600 140"/>
    <path d="M0 160 Q 75 175, 150 160 T 300 160 T 450 160 T 600 160"/>
    <path d="M0 180 Q 75 195, 150 180 T 300 180 T 450 180 T 600 180"/>
    <path d="M0 200 Q 75 215, 150 200 T 300 200 T 450 200 T 600 200"/>
    <path d="M0 220 Q 75 235, 150 220 T 300 220 T 450 220 T 600 220"/>
    <path d="M0 240 Q 75 255, 150 240 T 300 240 T 450 240 T 600 240"/>
    <path d="M0 260 Q 75 275, 150 260 T 300 260 T 450 260 T 600 260"/>
    <path d="M0 280 Q 75 295, 150 280 T 300 280 T 450 280 T 600 280"/>
    <path d="M0 300 Q 75 315, 150 300 T 300 300 T 450 300 T 600 300"/>
    <path d="M0 320 Q 75 335, 150 320 T 300 320 T 450 320 T 600 320"/>
    <path d="M0 340 Q 75 355, 150 340 T 300 340 T 450 340 T 600 340"/>
  </g>

  <!-- Central Concentric Guilloche Rosette (Spirographic Watermark) -->
  <g transform="translate(300, 190)" opacity="0.06" stroke="#065f46" stroke-width="0.8" fill="none">
    <ellipse rx="140" ry="90" transform="rotate(0)"/>
    <ellipse rx="140" ry="90" transform="rotate(15)"/>
    <ellipse rx="140" ry="90" transform="rotate(30)"/>
    <ellipse rx="140" ry="90" transform="rotate(45)"/>
    <ellipse rx="140" ry="90" transform="rotate(60)"/>
    <ellipse rx="140" ry="90" transform="rotate(75)"/>
    <ellipse rx="140" ry="90" transform="rotate(90)"/>
    <ellipse rx="140" ry="90" transform="rotate(105)"/>
    <ellipse rx="140" ry="90" transform="rotate(120)"/>
    <ellipse rx="140" ry="90" transform="rotate(135)"/>
    <ellipse rx="140" ry="90" transform="rotate(150)"/>
    <ellipse rx="140" ry="90" transform="rotate(165)"/>
  </g>

  <!-- Fine Micro-Dots Security Mesh -->
  <pattern id="sec_dots" x="0" y="0" width="12" height="12" patternUnits="userSpaceOnUse">
    <circle cx="6" cy="6" r="0.6" fill="#047857" opacity="0.08"/>
  </pattern>
  <rect width="600" height="380" fill="url(#sec_dots)"/>
</svg>
