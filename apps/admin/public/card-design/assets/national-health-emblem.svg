<svg width="120" height="120" viewBox="0 0 120 120" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Outer Gold Security Laurel Ring -->
  <circle cx="60" cy="60" r="56" stroke="#b45309" stroke-width="1.5" stroke-dasharray="3 2" opacity="0.6"/>
  <circle cx="60" cy="60" r="52" stroke="#047857" stroke-width="1.2"/>
  <circle cx="60" cy="60" r="49" fill="#ffffff"/>

  <!-- Subtle Concentric Circular Security Guilloche Rays -->
  <g opacity="0.12" stroke="#0f766e" stroke-width="0.75">
    <circle cx="60" cy="60" r="42"/>
    <circle cx="60" cy="60" r="36"/>
    <circle cx="60" cy="60" r="30"/>
    <circle cx="60" cy="60" r="24"/>
    <circle cx="60" cy="60" r="18"/>
  </g>

  <!-- Central National Healthcare Shield -->
  <path d="M60 18L84 27V52C84 71 73.5 83.5 60 88C46.5 83.5 36 71 36 52V27L60 18Z" 
        fill="url(#shield_grad)" stroke="#047857" stroke-width="1.8"/>

  <!-- Inner Shield Trim -->
  <path d="M60 22L80 29.5V52C80 68 71 78.5 60 83C49 78.5 40 68 40 52V29.5L60 22Z" 
        stroke="#6ee7b7" stroke-width="1" fill="#f0fdf4"/>

  <!-- 24-Spoke Ashoka Chakra Motif at top of shield -->
  <g transform="translate(60, 38)">
    <circle cx="0" cy="0" r="11" fill="#ffffff" stroke="#000080" stroke-width="1.5"/>
    <circle cx="0" cy="0" r="2" fill="#000080"/>
    <!-- 24 spokes -->
    <g stroke="#000080" stroke-width="0.75">
      <line x1="0" y1="-10" x2="0" y2="10"/>
      <line x1="-10" y1="0" x2="10" y2="0"/>
      <line x1="-7.07" y1="-7.07" x2="7.07" y2="7.07"/>
      <line x1="-7.07" y1="7.07" x2="7.07" y2="-7.07"/>
      <line x1="-9.66" y1="-2.59" x2="9.66" y2="2.59"/>
      <line x1="-9.66" y1="2.59" x2="9.66" y2="-2.59"/>
      <line x1="-2.59" y1="-9.66" x2="2.59" y2="9.66"/>
      <line x1="-2.59" y1="9.66" x2="2.59" y2="-9.66"/>
      <line x1="-8.66" y1="-5" x2="8.66" y2="5"/>
      <line x1="-8.66" y1="5" x2="8.66" y2="-5"/>
      <line x1="-5" y1="-8.66" x2="5" y2="8.66"/>
      <line x1="-5" y1="8.66" x2="5" y2="-8.66"/>
    </g>
  </g>

  <!-- Medical Cross & Asclepius Pulse Symbol -->
  <g transform="translate(60, 62)">
    <!-- Red Emergency Medical Cross -->
    <path d="M-4 -12H4V-4H12V4H4V12H-4V4H-12V-4H-4V-12Z" fill="#dc2626"/>
    <!-- Central Vital White Star/Node -->
    <circle cx="0" cy="0" r="2.2" fill="#ffffff"/>
    <path d="M-8 0H-3L-1 -3L1 3L3 0H8" stroke="#ffffff" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- Base Motto Banner: "सत्यमेव जयते • HEALTHCARD" -->
  <path d="M28 92C38 89 82 89 92 92L96 102C84 99.5 36 99.5 24 102L28 92Z" fill="#065f46" stroke="#047857" stroke-width="1"/>
  <text x="60" y="98.5" text-anchor="middle" font-family="'Inter', 'Noto Sans Devanagari', sans-serif" font-size="6.5" font-weight="700" fill="#ffffff" letter-spacing="0.5">
    सत्यमेव जयते • NHA
  </text>

  <!-- Definitions -->
  <defs>
    <linearGradient id="shield_grad" x1="60" y1="18" x2="60" y2="88" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#047857"/>
      <stop offset="100%" stop-color="#064e3b"/>
    </linearGradient>
  </defs>
</svg>
