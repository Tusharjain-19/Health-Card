        <line x1="0" y1="-140" x2="0" y2="140"/>
        <line x1="-140" y1="0" x2="140" y2="0"/>
        <line x1="-99" y1="-99" x2="99" y2="99"/>
        <line x1="-99" y1="99" x2="99" y2="-99"/>
        <line x1="-135" y1="-36" x2="135" y2="36"/>
        <line x1="-135" y1="36" x2="135" y2="-36"/>
        <line x1="-36" y1="-135" x2="36" y2="135"/>
        <line x1="-36" y1="135" x2="36" y2="-135"/>
        <line x1="-121" y1="-70" x2="121" y2="70"/>
        <line x1="-121" y1="70" x2="121" y2="-70"/>
        <line x1="-70" y1="-121" x2="70" y2="121"/>
        <line x1="-70" y1="121" x2="70" y2="-121"/>
