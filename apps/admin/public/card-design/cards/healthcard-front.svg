            <rect x="62" y="12" width="10" height="10"/>
            <rect x="82" y="12" width="10" height="10"/>
            <rect x="102" y="12" width="10" height="10"/>
            <rect x="12" y="62" width="10" height="10"/>
            <rect x="12" y="82" width="10" height="10"/>
            <rect x="12" y="102" width="10" height="10"/>

            <rect x="62" y="62" width="16" height="16"/>
            <rect x="88" y="62" width="24" height="16"/>
            <rect x="122" y="62" width="16" height="16"/>
            <rect x="148" y="62" width="16" height="16"/>

            <rect x="62" y="88" width="24" height="16"/>
            <rect x="96" y="88" width="16" height="24"/>
            <rect x="122" y="96" width="16" height="16"/>
            <rect x="148" y="88" width="24" height="16"/>

            <rect x="62" y="122" width="16" height="24"/>
            <rect x="88" y="132" width="24" height="16"/>
            <rect x="122" y="122" width="24" height="16"/>
            <rect x="156" y="122" width="16" height="24"/>

            <rect x="62" y="156" width="24" height="16"/>
            <rect x="96" y="156" width="16" height="16"/>
            <rect x="122" y="156" width="24" height="16"/>
            <rect x="156" y="156" width="16" height="16"/>
