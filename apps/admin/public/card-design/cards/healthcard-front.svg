        <path d="M54.5 14.5C48.2 14.5 43.1 19.6 43.1 25.9C43.1 27.6 43.5 29.2 44.2 30.6C39.4 33.1 36 38.2 36 44.1C36 50.8 40.4 56.5 46.5 58.5C46.2 59.8 46 61.2 46 62.6C46 68.9 51.1 74 57.4 74C63.7 74 68.8 68.9 68.8 62.6C68.8 61.2 68.6 59.8 68.3 58.5C74.4 56.5 78.8 50.8 78.8 44.1C78.8 38.2 75.4 33.1 70.6 30.6C71.3 29.2 71.7 27.6 71.7 25.9C71.7 19.6 66.6 14.5 60.3 14.5H54.5Z"/>
